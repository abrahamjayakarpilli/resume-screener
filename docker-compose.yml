version: '3.8'

services:
  talentlens-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/frontend
    environment:
      - DATABASE_URL=sqlite:///./talentlens.db
      - MOCK_LLM=true
      - GEMINI_API_KEY=
      - OPENAI_API_KEY=
      - SCORING_WEIGHT_TECH=0.40
      - SCORING_WEIGHT_EXP=0.30
      - SCORING_WEIGHT_PROJ=0.15
      - SCORING_WEIGHT_EDU=0.10
      - SCORING_WEIGHT_OTHER=0.05
    restart: unless-stopped
